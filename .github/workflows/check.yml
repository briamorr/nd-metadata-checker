name: ND metadata check

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Report even when nothing changed
        type: boolean
        default: false
      dry_run:
        description: Count Webex recipients without sending
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nd-metadata-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for metadata changes
        env:
          INTERSIGHT_API_KEY_ID: ${{ secrets.INTERSIGHT_API_KEY_ID }}
          INTERSIGHT_SECRET_KEY: ${{ secrets.INTERSIGHT_SECRET_KEY }}
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--notify webex --state-file state/nd_metadata_state.json)
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python nd_metadata_checker.py "${args[@]}"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/nd_metadata_state.json
          git diff --staged --quiet || git commit -m "chore: update ND metadata state [skip ci]"
          git push

      - name: Alert maintainer on failure
        if: failure()
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          MAINTAINER_WEBEX_EMAIL: ${{ secrets.MAINTAINER_WEBEX_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import notify_webex

          notify_webex.notify_person(
              os.environ["MAINTAINER_WEBEX_EMAIL"],
              f"**ND metadata check failed.** [View run]({os.environ['RUN_URL']})",
          )
          PY
